<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>App Hoster — Live Project Arcade</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-grid"></div>
  </div>

  <div class="page">
    <header class="site-header">
      <div class="header-text">
        <div class="eyebrow-row">
          <span class="live-pill">
            <span class="live-dot" aria-hidden="true"></span>
            Live Showcase
          </span>
          <span class="eyebrow-sep" aria-hidden="true">/</span>
          <p class="eyebrow">GitHub Pages &amp; Web Apps</p>
        </div>
        <h1>App <span class="title-gradient">Hoster</span></h1>
        <p class="subtitle">
          Interactive games, creative tools, and web apps built by
          <a href="https://github.com/georgefotiadis2010-dotcom" target="_blank" rel="noopener noreferrer">@georgefotiadis2010-dotcom</a>.
        </p>
      </div>

      <div class="controls">
        <label class="search-field" for="search-input">
          <span class="visually-hidden">Filter projects</span>
          <svg class="search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M8.5 3a5.5 5.5 0 1 0 3.473 9.765l3.631 3.631a.75.75 0 1 0 1.06-1.06l-3.63-3.632A5.5 5.5 0 0 0 8.5 3ZM4.5 8.5a4 4 0 1 1 8 0 4 4 0 0 1-8 0Z" fill="currentColor"/>
          </svg>
          <input
            id="search-input"
            type="search"
            placeholder="Search apps, games, tools…"
            autocomplete="off"
            spellcheck="false"
          >
          <kbd class="shortcut-hint" aria-hidden="true">/</kbd>
        </label>

        <div class="toolbar-row">
          <div class="filter-pills" id="filter-pills" role="group" aria-label="Filter by category">
            <button type="button" class="filter-pill is-active" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="filter-pill" data-filter="Game" aria-pressed="false">Games</button>
            <button type="button" class="filter-pill" data-filter="Tool" aria-pressed="false">Tools</button>
            <button type="button" class="filter-pill" data-filter="Fitness" aria-pressed="false">Fitness</button>
          </div>
          <p class="status-line" id="status-line" aria-live="polite"></p>
        </div>
      </div>
    </header>

    <main>
      <section class="card-grid" id="project-grid" aria-label="Hosted web applications"></section>
      <p class="empty-state" id="empty-state" hidden>
        No apps match your filter. Try clearing the search or switching categories.
      </p>
    </main>
  </div>

  <dialog class="preview-dialog" id="preview-dialog" aria-labelledby="dialog-title">
    <div class="dialog-shell">
      <div class="dialog-topbar">
        <div class="dialog-heading-group">
          <span class="dialog-category" id="dialog-category"></span>
          <h2 id="dialog-title"></h2>
        </div>
        <button type="button" class="dialog-close" id="dialog-close" aria-label="Close preview">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="dialog-media">
        <img id="dialog-img" src="" alt="" width="1280" height="800">
      </div>
      <p class="dialog-desc" id="dialog-desc"></p>
      <div class="dialog-actions">
        <a class="btn-primary" id="dialog-launch" href="#" target="_blank" rel="noopener noreferrer">
          Launch App
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M5.5 14.5 14.5 5.5m0 0H7.5m7 0v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <a class="btn-secondary" id="dialog-repo" href="#" target="_blank" rel="noopener noreferrer">
          View Source
        </a>
      </div>
    </div>
  </dialog>
</body>
</html>
